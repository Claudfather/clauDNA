name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-changelog diffs against origin/main; validate-manifest reads tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The check-set is defined once, in the Makefile (#303). CI runs the
      # same `make deps && make check` engineers run locally — add or
      # change checks there, never here.
      - name: Install check toolchain
        run: make deps

      - name: Run the check-set
        run: make check
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
