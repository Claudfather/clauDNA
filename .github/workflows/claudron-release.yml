name: claudron-release

# When Claudron publishes a release newer than contracts/claudron.ref, move
# clauDNA to it on a claudron/<tag> branch: the contract copy, the pin and
# output-guide §3 re-rendered (scripts/sync_claudron_contract.py --ref), with
# the check-set run on it. The logic lives in scripts/claudron_bump.py; the
# checks are the Makefile's.
#
# Then it tries to open the PR. GitHub Actions may not create PRs in this repo
# ("Allow GitHub Actions to create and approve pull requests" stays off, #432),
# so the PR is left to the fleet: the run leaves one issue for the release,
# asking for it, and ends green. Idempotent: a release that already has a PR
# stops the run, and a branch still waiting for one finds its issue again (and
# opens it only if it has none). With the setting on, the run opens the PR
# itself; a PR opened with the workflow token doesn't start CI, and the body
# says how to start it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write  # push claudron/<tag>
  pull-requests: write  # try to open its PR
  issues: write  # find or open the release's issue, when the PR can't be opened

concurrency:
  group: claudron-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # -eo pipefail: a failed `detect | tee` must fail the step, not leave the run green
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check-changelog diffs against origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Is there a newer Claudron release?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/claudron_bump.py detect | tee -a "$GITHUB_OUTPUT"
          echo "pinned=$(cat contracts/claudron.ref)" >> "$GITHUB_OUTPUT"

      - name: Stop if this release already has a PR, or waits for one
        id: branch
        if: steps.latest.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
          PINNED: ${{ steps.latest.outputs.pinned }}
        run: |
          name="claudron/$TAG"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # Assigned first: under -e a failed `gh` aborts here, where inside `[ ]` it would read as "has a PR".
          prs=$(gh pr list --head "$name" --state all --json number -q length)
          if [ "$prs" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$name already has a PR"
          elif git ls-remote --exit-code --heads origin "$name" >/dev/null; then
            # Pushed by an earlier run, with no PR yet: Actions may not open one here (#432), so it waits for
            # the fleet. Leave the release's issue, found again or opened once; failing that fails the run.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            python3 scripts/claudron_bump.py issue "$TAG" "$PINNED"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move to the release and run the checks
        id: move
        if: steps.latest.outputs.newer == 'true' && steps.branch.outputs.exists == 'false'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          printf '%s\n' "$TAG" > contracts/claudron.ref
          make deps-contract
          python3 scripts/sync_claudron_contract.py --ref "$TAG"
          python3 scripts/claudron_bump.py changelog "$TAG"
          git switch -c "${{ steps.branch.outputs.name }}"
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit -am "Move to Claudron $TAG"
          if make check; then echo "check=pass" >> "$GITHUB_OUTPUT"; else echo "check=fail" >> "$GITHUB_OUTPUT"; fi
          if make test-contract; then echo "contract=pass" >> "$GITHUB_OUTPUT"; else echo "contract=fail" >> "$GITHUB_OUTPUT"; fi

      - name: Open the PR, or leave the release's issue
        id: pr
        if: steps.move.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
          PINNED: ${{ steps.latest.outputs.pinned }}
          BRANCH: ${{ steps.branch.outputs.name }}
          CHECK: ${{ steps.move.outputs.check }}
          CONTRACT: ${{ steps.move.outputs.contract }}
        run: |
          git push origin "$BRANCH"
          python3 scripts/claudron_bump.py body "$TAG" "$PINNED" "$CHECK" "$CONTRACT" > "$RUNNER_TEMP/body.md"
          draft=""
          if [ "$CHECK$CONTRACT" != "passpass" ]; then draft="--draft"; fi
          if ! gh pr create $draft --base main --head "$BRANCH" \
              --title "Move to Claudron $TAG" --body-file "$RUNNER_TEMP/body.md"; then
            # Actions may not create PRs here (#432): the pushed branch waits for the fleet, and the issue asks.
            python3 scripts/claudron_bump.py issue "$TAG" "$PINNED" "$CHECK" "$CONTRACT"
          fi
