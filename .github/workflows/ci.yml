name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-changelog diffs against origin/main; validate-manifest reads tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The check-set is defined once, in the Makefile (#303). CI runs the
      # same `make deps && make check` engineers run locally — add or
      # change checks there, never here.
      - name: Install check toolchain
        run: make deps

      - name: Run the check-set
        run: make check
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  runtime-floor:
    # Hooks and lib/claudna run under the user's python3: 3.9 on stock macOS.
    # The check-set is still the Makefile's; this leg only picks the interpreter.
    name: runtime on Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install the runtime test toolchain
        run: make deps-runtime

      - name: Run the runtime suites
        run: make test-runtime
