name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check-changelog diffs against origin/main; validate-manifest reads tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The check-set is defined once, in the Makefile (#303). CI runs the
      # same `make deps && make check` engineers run locally — add or
      # change checks there, never here.
      - name: Install check toolchain
        run: make deps

      - name: Run the check-set
        run: make check
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  runtime-floor:
    # Hooks and lib/claudna run under the user's python3: 3.9 on stock macOS.
    # The check-set is still the Makefile's; this leg only picks the interpreter.
    name: runtime on Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install the runtime test toolchain
        run: make deps-runtime

      - name: Run the runtime suites
        run: make test-runtime

  claudron-contract:
    # clauDNA's Claudron door and harvest against the real engine, at the
    # release contracts/claudron.ref names. Targets live in the Makefile.
    name: contract with Claudron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the toolchain and the pinned Claudron
        run: make deps-contract

      - name: Run the live contract suite
        run: make test-contract

  claudron-floor:
    # Harvest against Claudron releases older than memory homes: one per code
    # path harvest keeps for them (Makefile CLAUDRON_FLOOR_REFS; a test there
    # keeps this matrix in step).
    name: harvest on Claudron ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.2.0, v0.7.0, v0.7.1]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the toolchain and Claudron ${{ matrix.ref }}
        run: make deps-contract CLAUDRON_REF=${{ matrix.ref }}

      - name: Run the live suite in floor mode
        run: make test-contract-floor
