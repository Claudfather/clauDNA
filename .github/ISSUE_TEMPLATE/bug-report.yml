name: Bug Report
description: Report a broken skill, hook, or unexpected behavior
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or component
      description: Which skill, hook, or agent is affected?
      placeholder: "/claudna:audit tech-debt, plugin-hooks/auto-format, etc."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? Be specific enough that someone else can follow along.
      placeholder: |
        1. Open a project with ...
        2. Run `/claudna:audit tech-debt`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages if any.
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: "Run `claude --version` to find this."
      placeholder: "1.0.0"
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: clauDNA version
      description: "Check `.claude-plugin/plugin.json` or run `/plugin list`."
      placeholder: "0.3.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — screenshots, logs, workarounds.
    validations:
      required: false
