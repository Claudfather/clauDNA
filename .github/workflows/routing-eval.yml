name: Routing eval

# `make routing-eval` (scripts/routing_eval.py) is paid, so it runs only on a PR
# carrying the `routing-eval` label (when the label is added, or on a push while
# it's there and the PR touches what routing depends on), or by hand. Needs the
# repository secret ANTHROPIC_API_KEY.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
    paths:
      - "skills/**"
      - "agents/**"
      - "plugin-hooks/**"
      - ".claude-plugin/**"
      - "tests/fixtures/routing-matrix.yaml"
      - "scripts/routing_eval.py"
      - "scripts/skill_checks.py"
      - "lib/**"
      - "Makefile"
      - ".github/workflows/routing-eval.yml"
  workflow_dispatch:

jobs:
  routing-eval:
    # A label added to a PR that already has `routing-eval` would otherwise re-run
    # the paid eval: on `labeled`, only this label's own addition counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'routing-eval') &&
       (github.event.action != 'labeled' || github.event.label.name == 'routing-eval'))
    # Job-level, so it applies only once the `if` lets the job run: a skipped
    # run (another label added) never cancels an eval in progress.
    concurrency:
      group: routing-eval-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the eval toolchain
        run: make deps deps-eval

      - name: Run the routing evals
        run: make routing-eval ROUTING_EVAL_ARGS="--out routing-eval.jsonl"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Keep the per-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-eval
          path: routing-eval.jsonl
          if-no-files-found: ignore
