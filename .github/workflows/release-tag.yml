# Auto-tag + auto-release when the plugin version lands on main (#154).
#
# The release procedure repeatedly left tags and release objects lagging
# plugin.json (marketplace served 0.6.1 while tags stopped at v0.5.0).
# This workflow makes the lag impossible: any push to main that changes
# `.claude-plugin/plugin.json`'s version gets a `v<version>` tag at that
# commit and a GitHub release whose notes are that version's CHANGELOG
# section. Idempotent — an existing tag or release is left untouched, so
# manually-cut releases (and re-runs) never conflict.

name: release-tag

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "tagged $TAG at $GITHUB_SHA"
          fi

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            exit 0
          fi
          # Extract this version's CHANGELOG section as the release notes.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "See CHANGELOG.md [$VERSION]." > /tmp/notes.md
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file /tmp/notes.md
          echo "released $TAG"
