# The Makefile-owned controller qualifies the exact candidate before it may
# create a tag or release. Existing remote identities/assets are immutable.
name: release-tag

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check toolchain
        run: make deps

      - name: Qualify and publish this exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish-release RELEASE_REF="$GITHUB_SHA" RELEASE_OUTPUT="$RUNNER_TEMP/claudna-release" RELEASE_REPO="$GITHUB_REPOSITORY"
